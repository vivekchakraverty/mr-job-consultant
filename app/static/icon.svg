<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Mr. Job Consultant">
  <title>Mr. Job Consultant</title>
  <!-- soft sage tile -->
  <rect width="64" height="64" rx="16" fill="#e3ede1"/>
  <clipPath id="tile"><rect width="64" height="64" rx="16"/></clipPath>
  <g clip-path="url(#tile)">
    <!-- neck -->
    <path d="M28 36 H36 V41.6 L32 44.6 L28 41.6 Z" fill="#d99f7a"/>
    <g transform="translate(0 -3)">
      <!-- suit jacket -->
      <path d="M8 70 C8 51 17 44.5 32 44.5 C47 44.5 56 51 56 70 Z" fill="#2f3e4e"/>
      <!-- shirt -->
      <path d="M25.5 44.6 L32 59 L38.5 44.6 Z" fill="#fffaf3"/>
      <!-- lapels -->
      <path d="M24.6 44.9 L31.2 58.6 L26.4 52.6 L22.2 46.6 Z" fill="#22303d"/>
      <path d="M39.4 44.9 L32.8 58.6 L37.6 52.6 L41.8 46.6 Z" fill="#22303d"/>
      <!-- collar points -->
      <path d="M26 44.7 L30.8 46.9 L29 50.2 Z" fill="#ffffff"/>
      <path d="M38 44.7 L33.2 46.9 L35 50.2 Z" fill="#ffffff"/>
      <!-- tie -->
      <path d="M30.1 45.8 H33.9 L33.2 48.6 H30.8 Z" fill="#b8694a"/>
      <path d="M30.8 48.6 H33.2 L34.6 57.8 L32 60.8 L29.4 57.8 Z" fill="#d88b67"/>
      <!-- pocket square and button -->
      <path d="M42.6 53.2 L46.6 51.6 L47.2 53.4 Z" fill="#fffaf3"/>
      <circle cx="32" cy="63.4" r="0.9" fill="#1b2631"/>
    </g>
    <!-- ears -->
    <circle cx="21.9" cy="27.6" r="2.3" fill="#e5ad88"/>
    <circle cx="42.1" cy="27.6" r="2.3" fill="#e5ad88"/>
    <!-- head -->
    <ellipse cx="32" cy="27" rx="10" ry="11.4" fill="#e9b892"/>
    <!-- side-parted office haircut -->
    <path d="M21.6 26.4 C20.6 16.6 26.4 12.4 32.6 12.4 C39.6 12.4 43.6 16.8 42.5 25.6 C41.4 21 38.6 19 33.8 18.7 C30.6 18.5 28.2 17.6 27.2 16.4 C26.4 19.6 24.4 22 21.6 26.4 Z" fill="#3a2c25"/>
    <!-- friendly face -->
    <circle cx="28.2" cy="28.4" r="1.15" fill="#3a2c25"/>
    <circle cx="35.8" cy="28.4" r="1.15" fill="#3a2c25"/>
    <path d="M28.9 32.9 Q32 35.3 35.1 32.9" fill="none" stroke="#9c5a3c" stroke-width="1.3" stroke-linecap="round"/>
  </g>
</svg>
