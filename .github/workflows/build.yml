# Desktop builds for Windows, Linux and macOS, made with packaging/build.py on each system
# (PyInstaller can only build for the system it runs on).
#
#   Run manually (Actions > Desktop builds > Run workflow): builds are kept as run artifacts;
#   give a release tag to also attach them to that release, created as a draft if it doesn't exist.
#   Push a v* tag: builds are attached to that tag's release the same way.
#   Pull requests that touch the packaging are built (not released), so a broken build shows up early.
name: Desktop builds

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - "packaging/**"
      - ".github/workflows/build.yml"
      - "app/launcher.py"
      - "app/youtube/**"
      - "requirements.txt"
  workflow_dispatch:
    inputs:
      release:
        description: "Release tag to attach the builds to, e.g. v0.3.0 (blank: run artifacts only)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, label: Windows x64 }
          - { os: ubuntu-22.04, label: Linux x64 }        # older glibc, so it runs on more distributions
          - { os: macos-15, label: macOS Apple Silicon }
          - { os: macos-15-intel, label: macOS Intel }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/youtube/package-lock.json

      - name: Install Python packages
        run: python -m pip install -r requirements.txt pyinstaller

      - name: Build, self-check and pack
        id: build
        run: python packaging/build.py

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}
          path: ${{ steps.build.outputs.archive }}
          if-no-files-found: error
          retention-days: 30

  attach:
    name: Attach to release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: builds
          merge-multiple: true

      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release || github.ref_name }}
        run: |
          ls -la builds
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --target "$GITHUB_SHA" \
              --title "$TAG" --notes "Desktop builds for $TAG."
          fi
          gh release upload "$TAG" builds/* --repo "$GITHUB_REPOSITORY" --clobber
